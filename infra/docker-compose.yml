services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: designsoftddd_app
    environment:
      NODE_ENV: development
      APP_LOG_LEVEL: info
      PORT: 3333
      OTEL_SERVICE_NAME: rocketseat-ddd-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=designsoftddd,deployment.environment.name=development,service.version=1.0.0
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: 10000
      OTEL_LOG_LEVEL: info
    ports:
      - "3333:3333"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo_otel
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki_otel
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./ops/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mimir:
    build:
      context: .
      dockerfile: images/mimir/Dockerfile
    container_name: mimir_otel
    command:
      - -config.file=/etc/mimir/mimir.yaml
      - -distributor.otel-promote-resource-attributes=service.name,service.namespace,service.version,deployment.environment.name
    volumes:
      - ./ops/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data-otel:/data
    ports:
      - "9009:9009"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:9009/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_otel
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      mimir:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  otel-collector:
    build:
      context: .
      dockerfile: images/otel-collector/Dockerfile
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8888"
      - "13133:13133"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      mimir:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:13133/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_otel
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
      GF_METRICS_DISABLE_TOTAL_STATS: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data-otel:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  mimir-data-otel:
  prometheus-data:
  grafana-data-otel:
